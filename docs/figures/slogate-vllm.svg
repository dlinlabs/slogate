<svg xmlns="http://www.w3.org/2000/svg" width="800" height="694" viewBox="0 0 800 694" role="img" aria-labelledby="title desc">
  <title id="title">How slogate talks to vLLM: the 2048 vs 512 trial</title>
  <desc id="desc">The operator starts one vLLM server at a time. Only --max-num-batched-tokens changes: A uses 2048, B uses 512. slogate sends the same scheduled chat requests, timestamps returning chunks and evaluates paired TTFT p99 after checking the client. A separate correctness run requests native token IDs instead of measuring latency.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L11 6 L0 12 Z" fill="#284b63"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172b3a; }
      .title { font-size: 26px; font-weight: 700; }
      .actor { font-size: 23px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 600; }
      .note { font-size: 16px; }
      .code { font: 16px ui-monospace, Consolas, monospace; }
      .client { fill: #0d5364; }
      .engine { fill: #713f12; }
      .center { text-anchor: middle; }
      .lane { stroke: #8396a2; stroke-width: 2; stroke-dasharray: 4 6; }
      .msg { fill: none; stroke: #284b63; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="798" height="692" rx="18" fill="#fff" stroke="#c4cfd5"/>
  <text x="24" y="39" class="title">slogate and vLLM: who changes what?</text>
  <text x="24" y="65" class="note">One RTX 4090. Same workload. A and B run one at a time, not side by side.</text>

  <rect x="24" y="86" width="364" height="135" rx="12" fill="#e9f5f7" stroke="#80b4bd"/>
  <text x="42" y="116" class="actor client">slogate</text>
  <text x="42" y="143" class="note">Freeze the load and decision rule.</text>
  <text x="42" y="172" class="label client">6 A/B pairs; 50 ms client checks</text>
  <text x="42" y="198" class="note">TTFT p99 margin: +2,000 ms</text>

  <rect x="412" y="86" width="364" height="135" rx="12" fill="#fff4e4" stroke="#c2a06a"/>
  <text x="430" y="116" class="actor engine">vLLM</text>
  <text x="430" y="143" class="note">Operator starts A or B with one change:</text>
  <text x="430" y="172" class="code">--max-num-batched-tokens</text>
  <text x="430" y="198" class="label engine">A: 2048  /  B: 512 tokens per step</text>

  <path class="lane" d="M84 221 V386 M716 221 V368"/>
  <text x="400" y="251" class="code center">POST /v1/chat/completions</text>
  <text x="400" y="275" class="note center">Same prompts and arrivals; stream=true, max_tokens=128</text>
  <path class="msg" d="M84 290 H714"/>
  <circle cx="84" cy="290" r="4" fill="#284b63"/>
  <text x="400" y="327" class="label center">Streamed text chunks and token usage</text>
  <text x="400" y="350" class="note center">slogate timestamps the chunks as they arrive.</text>
  <path class="msg" d="M716 365 H86"/>
  <circle cx="716" cy="365" r="4" fill="#284b63"/>

  <rect x="24" y="386" width="752" height="79" rx="12" fill="#e9f5f7" stroke="#80b4bd"/>
  <text x="42" y="416" class="label client">Performance verdict belongs to slogate, not vLLM.</text>
  <text x="42" y="442" class="note">Invalid client timing invalidates the test. Compare valid paired TTFT p99s; report TPOT and ITL.</text>

  <rect x="24" y="486" width="752" height="185" rx="12" fill="#f6f7f9" stroke="#96a4ae" stroke-dasharray="6 4"/>
  <text x="42" y="514" class="label">Separate correctness run: dedicated servers, no performance samples</text>
  <text x="84" y="545" class="label client center">slogate</text>
  <text x="716" y="545" class="label engine center">vLLM</text>
  <path class="lane" d="M84 551 V626 M716 551 V626"/>
  <text x="400" y="547" class="code center">POST /v1/completions</text>
  <text x="400" y="570" class="note center">stream=false, return_token_ids=true, max_tokens=24</text>
  <path class="msg" d="M84 582 H714"/>
  <text x="400" y="609" class="label center">Native output token IDs</text>
  <path class="msg" d="M716 623 H86"/>
  <text x="42" y="652" class="note">slogate compares A's IDs with B's for four fixed cases; this is not a latency verdict.</text>
</svg>
